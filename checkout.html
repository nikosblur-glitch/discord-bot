```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Checkout | Discord Board Marketplace</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0d12;
    color: white;
    min-height: 100vh;
}

nav {
    padding: 18px 8%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #11141c;
    border-bottom: 1px solid #242936;
}

.logo {
    color: #5865f2;
    font-size: 21px;
    font-weight: bold;
    text-decoration: none;
}

.back {
    color: #d5d7df;
    text-decoration: none;
}

.container {
    max-width: 900px;
    margin: 50px auto;
    padding: 20px;
}

h1 {
    margin-bottom: 30px;
}

.checkout-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

.box {
    padding: 30px;
    background: #11141c;
    border: 1px solid #242936;
    border-radius: 16px;
}

.box h2 {
    margin-bottom: 25px;
}

.order-item {
    display: flex;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid #242936;
}

.total {
    display: flex;
    justify-content: space-between;
    margin-top: 25px;
    font-size: 24px;
    font-weight: bold;
    color: #5865f2;
}

label {
    display: block;
    margin: 15px 0 7px;
    color: #c3c6d0;
}

input,
select,
textarea {
    width: 100%;
    padding: 13px;
    background: #0b0d12;
    border: 1px solid #303542;
    border-radius: 8px;
    color: white;
    outline: none;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.payment-methods {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 10px;
}

.payment-method {
    padding: 18px;
    background: #0b0d12;
    border: 2px solid #303542;
    border-radius: 10px;
    cursor: pointer;
    text-align: center;
    font-weight: bold;
}

.payment-method.active {
    border-color: #5865f2;
    background: #171a27;
}

.payment-method input {
    display: none;
}

.payment-info {
    margin-top: 20px;
    padding: 15px;
    background: #171a22;
    border-radius: 8px;
    color: #999eac;
    line-height: 1.6;
}

.submit {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    border: none;
    border-radius: 8px;
    background: #5865f2;
    color: white;
    font-weight: bold;
    cursor: pointer;
    font-size: 16px;
}

.submit:hover {
    background: #4752c4;
}

.empty {
    text-align: center;
    padding: 50px;
}

.loading {
    display: none;
    text-align: center;
    padding: 40px;
}

.spinner {
    width: 45px;
    height: 45px;
    margin: 0 auto 20px;
    border: 5px solid #242936;
    border-top-color: #5865f2;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

@media (max-width: 750px) {

    .checkout-grid {
        grid-template-columns: 1fr;
    }

    .payment-methods {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>

<a
href="index.html"
class="logo"
>
Discord Board Marketplace
</a>

<a

class="back"
>
← Back to Cart
</a>

</nav>


<main class="container">


<div id="checkoutContent">


<h1>
Checkout
</h1>


<div class="checkout-grid">


<!-- ORDER SUMMARY -->

<section class="box">

<h2>
Your Order
</h2>

<div id="orderItems">
</div>

<div class="total">

<span>
Total
</span>

<span>
€<span id="total">0.00</span>
</span>

</div>

</section>


<!-- CUSTOMER INFORMATION -->

<section class="box">

<h2>
Customer Information
</h2>


<form id="checkoutForm">


<label for="name">
Full Name
</label>

<input
id="name"
type="text"
required
placeholder="Your name"
>


<label for="email">
Email
</label>

<input
id="email"
type="email"
required
placeholder="you@example.com"
>

Discord Username
</label>

<input
id="discord"
type="text"
required
placeholder="username"
>


<label>
Payment Method
</label>

<input
type="radio"
name="payment"
value="PayPal"
required
>

PayPal

<input
type="radio"
name="payment"
value="Revolut"
>

Revolut

</label>


</div>


<div
id="paymentInfo"
class="payment-info"
>

Select a payment method.

</div>


<label for="notes">
Order Notes
</label>

<textarea
id="notes"
placeholder="Optional notes..."
></textarea>


<button
type="submit"
class="submit"
>

Continue to Payment

</button>


</form>


</section>


</div>


</div>


<!-- LOADING -->

<div
id="loading"
class="loading"
>

<div class="spinner">
</div>

<h2>
Preparing your checkout...
</h2>

<p>
Please wait a moment.
</p>

</div>


</main>


<script>


let cart =

JSON.parse(

localStorage.getItem(
"cart"
)

) || [];


const orderItems =

document.getElementById(
"orderItems"
);


const totalElement =

document.getElementById(
"total"
);


let total = 0;


if (
cart.length === 0
) {


orderItems.innerHTML = `

<div class="empty">

<h2>
Your cart is empty.
</h2>

<a href="bots.html">
Go back to Bots
</a>

</div>

`;


} else {


cart.forEach(

item => {


const price =

Number(item.price) || 0;


total += price;


const div =

document.createElement(
"div"
);


div.className =
"order-item";


div.innerHTML = `

<span>
${item.name}
</span>

<strong>
€${price.toFixed(2)}
</strong>

`;


orderItems.appendChild(
div
);


}

);


}


totalElement.textContent =

total.toFixed(2);



/* PAYMENT SELECTION */


const paymentButtons =

document.querySelectorAll(
".payment-method"
);


const paymentInfo =

document.getElementById(
"paymentInfo"
);


paymentButtons.forEach(

button => {


button.addEventListener(

"click",

function() {


paymentButtons.forEach(

item =>

item.classList.remove(
"active"
)

);


this.classList.add(
"active"
);


const input =

this.querySelector(
"input"
);


if (
input.value ===
"PayPal"
) {


paymentInfo.innerHTML =

"PayPal selected. " +
"After submitting your order, " +
"you will be redirected to the " +
"official PayPal checkout.";

}


if (
input.value ===
"Revolut"
) {


paymentInfo.innerHTML =

"Revolut selected. " +
"After submitting your order, " +
"you will continue to the " +
"official Revolut payment page.";

}


}

);

}

);



/* CHECKOUT */


document
.getElementById(
"checkoutForm"
)
.addEventListener(

"submit",

function(event) {


event.preventDefault();


if (
cart.length === 0
) {

alert(
"Your cart is empty."
);

return;

}


const name =

document
.getElementById(
"name"
)
.value.trim();


const email =

document
.getElementById(
"email"
)
.value.trim();


const discord =

document
.getElementById(
"discord"
)
.value.trim();


const payment =

document
.querySelector(
'input[name="payment"]:checked'
);


if (
!payment
) {

alert(
"Please select a payment method."
);

return;

}


/* SHOW LOADING */


document
.getElementById(
"checkoutContent"
)
.style.display =
"none";


document
.getElementById(
"loading"
)
.style.display =
"block";


const orderId =

"DBM-" +
Date.now();


setTimeout(

function() {


/*
    FRONTEND DEMO FLOW

    Real payment requires
    official PayPal/Revolut
    checkout integration.
*/


const params =

new URLSearchParams({

order:
orderId,

payment:
payment.value,

total:
total.toFixed(2)

});


localStorage.setItem(

"lastOrder",

JSON.stringify({

orderId:
orderId,

name:
name,

email:
email,

discord:
discord,

payment:
payment.value,

total:
total,

items:
cart

})

);


localStorage.removeItem(
"cart"
);


window.location.href =

"order-success.html?" +
params.toString();


},

1500

);


}

);


</script>


</body>

</html>
