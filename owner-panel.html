```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Owner Panel</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    min-height: 100vh;

    padding: 40px 20px;

    font-family: Arial, sans-serif;

    color: white;

    background:
    radial-gradient(
        circle at top left,
        rgba(88,101,242,0.25),
        transparent 35%
    ),

    #05060b;

}

.container {

    max-width: 1000px;

    margin: auto;

}

.panel {

    padding: 30px;

    border-radius: 22px;

    background:
    rgba(255,255,255,0.055);

    border:
    1px solid
    rgba(255,255,255,0.12);

    backdrop-filter:
    blur(25px);

}

h1 {

    margin-bottom: 10px;

}

.subtitle {

    color:
    rgba(255,255,255,0.5);

    margin-bottom: 30px;

}

.form {

    display: grid;

    grid-template-columns:
    repeat(2,1fr);

    gap: 12px;

}

.full {

    grid-column:
    1 / -1;

}

input,
textarea {

    width: 100%;

    padding: 14px;

    border-radius: 10px;

    border:
    1px solid
    rgba(255,255,255,0.1);

    background:
    rgba(255,255,255,0.06);

    color: white;

    outline: none;

}

textarea {

    min-height: 100px;

}

button {

    padding: 13px 20px;

    border: none;

    border-radius: 10px;

    color: white;

    font-weight: bold;

    cursor: pointer;

}

.add {

    margin-top: 15px;

    background:
    linear-gradient(
        135deg,
        #5865f2,
        #8b5cf6
    );

}

.list {

    margin-top: 40px;

    display: grid;

    gap: 12px;

}

.item {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;

    padding: 18px;

    border-radius: 15px;

    background:
    rgba(255,255,255,0.05);

}

.actions {

    display: flex;

    gap: 8px;

}

.restock {

    background:
    rgba(30,180,120,0.2);

}

.edit {

    background:
    rgba(88,101,242,0.25);

}

.delete {

    background:
    rgba(220,60,70,0.25);

}

@media(max-width:650px) {

    .form {

        grid-template-columns:
        1fr;

    }

    .full {

        grid-column:
        auto;

    }

    .item {

        flex-direction:
        column;

        align-items:
        flex-start;

    }

}

</style>

</head>


<body>


<div class="container">


<div class="panel">


<h1>

🔐 Owner Panel

</h1>


<p class="subtitle">

Manage your Discord Bot Marketplace.

</p>



<div class="form">


<input
id="name"
placeholder="Bot Name"
/>


<input
id="price"
type="number"
step="0.01"
placeholder="Price (€)"
/>


<input
id="stock"
type="number"
min="0"
placeholder="Stock"
/>


<input
id="invite"
placeholder="Discord Invite Link"
/>


<input
id="image"
class="full"
placeholder="Image URL"
/>


<textarea
id="description"
class="full"
placeholder="Bot Description"
></textarea>


</div>


<button
class="add"
onclick="addBot()"
>

➕ Add Bot

</button>



<div
id="list"
class="list"
>

</div>


</div>


</div>



<script>


const STORAGE_KEY =
"DBM_MARKETPLACE_BOTS";


let bots =

JSON.parse(

localStorage.getItem(
STORAGE_KEY
)

) || [];



function save() {

    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(
            bots
        )

    );

}



function addBot() {


    const name =

    document
    .getElementById(
        "name"
    )
    .value
    .trim();


    const price =

    Number(

        document
        .getElementById(
            "price"
        )
        .value

    );


    const stock =

    Number(

        document
        .getElementById(
            "stock"
        )
        .value

    );


    const invite =

    document
    .getElementById(
        "invite"
    )
    .value
    .trim();


    const image =

    document
    .getElementById(
        "image"
    )
    .value
    .trim();


    const description =

    document
    .getElementById(
        "description"
    )
    .value
    .trim();



    if (

        !name ||

        !Number.isFinite(
            price
        ) ||

        !Number.isInteger(
            stock
        ) ||

        stock < 0

    ) {


        alert(
            "Enter Bot Name, Price and Stock."
        );


        return;

    }



    bots.push({

        id:
        Date.now(),

        name:
        name,

        price:
        price,

        stock:
        stock,

        invite:
        invite,

        image:
        image,

        description:
        description

    });



    save();


    clear();


    render();


    alert(
        "Bot added successfully!"
    );

}



function restock(
    id
) {


    const bot =

    bots.find(

        item =>
        item.id ===
        id

    );


    if (!bot) {

        return;

    }



    const amount =

    Number(

        prompt(
            "How many units to add?"
        )

    );



    if (

        !Number.isInteger(
            amount
        ) ||

        amount <= 0

    ) {

        return;

    }



    bot.stock +=
    amount;


    save();


    render();

}



function deleteBot(
    id
) {


    if (

        !confirm(
            "Delete this bot?"
        )

    ) {

        return;

    }



    bots =

    bots.filter(

        bot =>
        bot.id !==
        id

    );


    save();


    render();

}



function clear() {


    document
    .getElementById(
        "name"
    )
    .value = "";


    document
    .getElementById(
        "price"
    )
    .value = "";


    document
    .getElementById(
        "stock"
    )
    .value = "";


    document
    .getElementById(
        "invite"
    )
    .value = "";


    document
    .getElementById(
        "image"
    )
    .value = "";


    document
    .getElementById(
        "description"
    )
    .value = "";

}



function render() {


    const list =

    document
    .getElementById(
        "list"
    );


    list.innerHTML =
    "";



    if (
        bots.length === 0
    ) {


        list.innerHTML =

        "<p>No bots added yet.</p>";


        return;

    }



    bots.forEach(

        bot => {


            const item =

            document
            .createElement(
                "div"
            );


            item.className =
            "item";


            item.innerHTML = `

            <div>

            <strong>

            ${escapeHTML(
                bot.name
            )}

            </strong>

            <br>

            €${Number(
                bot.price
            ).toFixed(2)}

            • Stock:
            ${bot.stock}

            </div>


            <div class="actions">


            <button

            class="restock"

            onclick="restock(
                ${bot.id}
            )"

            >

            🔄 Restock

            </button>


            <button

            class="delete"

            onclick="deleteBot(
                ${bot.id}
            )"

            >

            🗑️ Delete

            </button>


            </div>

            `;


            list.appendChild(
                item
            );

        }

    );

}



function escapeHTML(
    value
) {

    return String(
        value || ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}



render();


</script>


</body>

</html>
