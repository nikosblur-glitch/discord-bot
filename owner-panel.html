<style>

* {

body {

    Arial,

    radial-gradient(

.container {

}


.header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    blur(25px);

    -webkit-backdrop-filter:
    blur(25px);

    border-radius: 22px;

    box-shadow:
    0 25px 80px
    rgba(0,0,0,0.35);

    padding: 30px;

    font-size: 34px;

    rgba(255,255,255,0.5);

    repeat(2, 1fr);

}

textarea,
select {

    resize: vertical;

    rgba(88,101,242,0.15);

    .form-grid {

        grid-template-columns: 1fr;

        flex-direction: column;

        flex-direction: column;

    }

</style>

</head>


<body>


<div class="container">


<div class="header">

<div class="logo">

Discord
<span>Board</span>
Marketplace

</div>

<a
href="bots.html"
style="
color:white;
text-decoration:none;
background:rgba(255,255,255,0.08);
padding:12px 18px;
border-radius:10px;
"
>

← View Bots

</a>

</div>



<div class="glass dashboard">


<h1>

🔐 Owner Panel

</h1>


<p class="subtitle">

Manage your Discord bots, prices,
stock and products.

</p>



<div class="form-grid">


<input
id="botName"
placeholder="Bot Name"
/>


<input
id="botPrice"
type="number"
step="0.01"
min="0"
placeholder="Price (€)"
/>


<input
id="botStock"
type="number"
min="0"
placeholder="Stock"
/>


<input
id="botInvite"
placeholder="Discord Invite Link"
/>


<input
id="botImage"
class="full"
placeholder="Bot Image URL"
/>


<textarea
id="botDescription"
class="full"
placeholder="Bot Description"
></textarea>


</div>



<div class="buttons">


<button
class="primary"
onclick="saveBot()"
>

➕ Add Bot

</button>


<button
class="secondary"
onclick="clearForm()"
>

Clear

</button>


</div>


<div
id="status"
class="status"
></div>



<h2 class="inventory-title">

📦 Bot Inventory

</h2>


<div
id="botList"
class="bot-list"
></div>


</div>


</div>



<script>


/* =====================================================
   DATABASE
===================================================== */


const STORAGE_KEY =
"DBM_MARKETPLACE_BOTS";


let bots =

JSON.parse(

localStorage.getItem(
STORAGE_KEY
)

) || [];



let editingId = null;



/* =====================================================
   ELEMENTS
===================================================== */


const nameInput =
document.getElementById(
"botName"
);


const priceInput =
document.getElementById(
"botPrice"
);


const stockInput =
document.getElementById(
"botStock"
);


const inviteInput =
document.getElementById(
"botInvite"
);


const imageInput =
document.getElementById(
"botImage"
);


const descriptionInput =
document.getElementById(
"botDescription"
);


const botList =
document.getElementById(
"botList"
);


const statusBox =
document.getElementById(
"status"
);



/* =====================================================
   SAVE DATA
===================================================== */


function saveData() {

    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(
            bots
        )

    );

}



/* =====================================================
   ADD / EDIT BOT
===================================================== */


function saveBot() {


    const name =
    nameInput.value.trim();


    const price =
    Number(
        priceInput.value
    );


    const stock =
    Number(
        stockInput.value
    );


    const invite =
    inviteInput.value.trim();


    const image =
    imageInput.value.trim();


    const description =
    descriptionInput.value.trim();



    if (
        !name ||
        !Number.isFinite(price) ||
        price < 0 ||
        !Number.isInteger(stock) ||
        stock < 0
    ) {

        showStatus(
            "Please enter a valid name, price and stock.",
            "error"
        );

        return;

    }



    if (editingId !== null) {


        const bot =

        bots.find(

            item =>
            item.id ===
            editingId

        );


        if (bot) {

            bot.name =
            name;

            bot.price =
            price;

            bot.stock =
            stock;

            bot.invite =
            invite;

            bot.image =
            image;

            bot.description =
            description;

        }


        editingId = null;


        showStatus(
            "Bot updated successfully!",
            "success"
        );


    } else {


        const newBot = {


            id:
            Date.now(),


            name:
            name,


            price:
            price,


            stock:
            stock,


            invite:
            invite,


            image:
            image,


            description:
            description


        };


        bots.push(
            newBot
        );


        showStatus(
            "Bot added successfully!",
            "success"
        );

    }



    saveData();

    clearForm();

    renderBots();

}



/* =====================================================
   RENDER BOTS
===================================================== */


function renderBots() {


    botList.innerHTML =
    "";



    if (
        bots.length === 0
    ) {


        botList.innerHTML = `

        <div class="empty">

        📦 No bots in your inventory yet.

        <br><br>

        Use the form above to add your first bot.

        </div>

        `;


        return;

    }



    bots.forEach(

        bot => {


            const item =
            document.createElement(
                "div"
            );


            item.className =
            "bot-item";


            const image =
            bot.image ||

            "https://via.placeholder.com/100";



            const stockClass =

            bot.stock > 0

            ?

            "stock"

            :

            "out";



            const stockText =

            bot.stock > 0

            ?

            `Stock: ${bot.stock}`

            :

            "Out of Stock";



            item.innerHTML = `


            <div class="bot-left">


                <img

                class="bot-image"

                src="${escapeHTML(
                    image
                )}"

                alt="Bot"


                >


                <div class="bot-info">


                    <h3>

                    ${escapeHTML(
                        bot.name
                    )}

                    </h3>


                    <p>

                    €${Number(
                        bot.price
                    ).toFixed(2)}

                    </p>


                    <p class="${stockClass}">

                    ${stockText}

                    </p>


                </div>


            </div>



            <div class="bot-actions">


                <button

                class="restock"

                onclick="restockBot(
                    ${bot.id}
                )"

                >

                🔄 Restock

                </button>


                <button

                class="edit"

                onclick="editBot(
                    ${bot.id}
                )"

                >

                ✏️ Edit

                </button>


                <button

                class="danger"

                onclick="deleteBot(
                    ${bot.id}
                )"

                >

                🗑️ Delete

                </button>


            </div>


            `;


            botList.appendChild(
                item
            );


        }

    );

}



/* =====================================================
   RESTOCK
===================================================== */


function restockBot(
    id
) {


    const bot =

    bots.find(

        item =>
        item.id ===
        id

    );


    if (!bot) {

        return;

    }



    const amount =

    Number(

        prompt(
            `Current stock: ${bot.stock}\nHow many do you want to add?`
        )

    );



    if (

        !Number.isInteger(
            amount
        ) ||

        amount <= 0

    ) {


        showStatus(
            "Invalid restock amount.",
            "error"
        );


        return;

    }



    bot.stock +=
    amount;


    saveData();

    renderBots();


    showStatus(
        "Stock updated successfully!",
        "success"
    );

}



/* =====================================================
   EDIT BOT
===================================================== */


function editBot(
    id
) {


    const bot =

    bots.find(

        item =>
        item.id ===
        id

    );


    if (!bot) {

        return;

    }



    editingId =
    id;


    nameInput.value =
    bot.name;


    priceInput.value =
    bot.price;


    stockInput.value =
    bot.stock;


    inviteInput.value =
    bot.invite || "";


    imageInput.value =
    bot.image || "";


    descriptionInput.value =
    bot.description || "";



    window.scrollTo({

        top:
        0,

        behavior:
        "smooth"

    });


    showStatus(
        "Editing bot. Press Add Bot to save changes.",
        "success"
    );

}



/* =====================================================
   DELETE BOT
===================================================== */


function deleteBot(
    id
) {


    const bot =

    bots.find(

        item =>
        item.id ===
        id

    );


    if (!bot) {

        return;

    }



    const confirmed =

    confirm(

        `Delete "${bot.name}" from your marketplace?`

    );



    if (!confirmed) {

        return;

    }



    bots =

    bots.filter(

        item =>
        item.id !==
        id

    );


    saveData();

    renderBots();


    showStatus(
        "Bot deleted.",
        "success"
    );

}



/* =====================================================
   CLEAR FORM
===================================================== */


function clearForm() {


    editingId =
    null;


    nameInput.value =
    "";


    priceInput.value =
    "";


    stockInput.value =
    "";


    inviteInput.value =
    "";


    imageInput.value =
    "";


    descriptionInput.value =
    "";

}



/* =====================================================
   STATUS
===================================================== */


function showStatus(
    message,
    type
) {


    statusBox.textContent =
    message;


    statusBox.className =

    "status " +

    type;


    setTimeout(

        () => {

            statusBox.className =
            "status";

        },

        3000

    );

}



/* =====================================================
   SECURITY
===================================================== */


function escapeHTML(
    value
) {


    return String(
        value
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}



/* =====================================================
   START
===================================================== */


renderBots();


</script>


</body>

</html>
