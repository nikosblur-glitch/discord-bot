<body>


<nav>


<div class="logo">

Discord Board Marketplace

</div>


<a
href="index.html"
class="logout"
>

← Back to Website

</a>


</nav>


<main
class="container"
>


<h1>

Owner Panel

</h1>


<p class="subtitle">

Manage your Discord bots and marketplace inventory.

</p>



<!-- STATS -->


<section
class="stats"
>


<div class="stat">

<h3>
Total Bots
</h3>

<strong
id="totalBots"
>
0
</strong>

</div>


<div class="stat">

<h3>
Available Stock
</h3>

<strong
id="totalStock"
>
0
</strong>

</div>


<div class="stat">

<h3>
Hidden Bots
</h3>

<strong
id="hiddenBots"
>
0
</strong>

</div>


</section>



<!-- ADD BOT -->


<section
class="add-box"
>


<h2>

Add New Bot

</h2>


<div
class="form-grid"
>


<input
id="botName"
type="text"
placeholder="Bot name"
>


<input
id="botPrice"
type="number"
step="0.01"
placeholder="Price"
>


<input
id="botStock"
type="number"
placeholder="Stock"
>


<button
onclick="addBot()"
>

Add Bot

</button>


</div>


</section>



<!-- BOT LIST -->


<section
class="bot-list"
id="botList"
>


</section>


</main>



<script>


// ======================================
// DATABASE
// ======================================


let bots =

JSON.parse(

localStorage.getItem(
"ownerBots"
)

) || [];



// ======================================
// SAVE
// ======================================


function saveBots() {

    localStorage.setItem(

        "ownerBots",

        JSON.stringify(
            bots
        )

    );

}



// ======================================
// ADD BOT
// ======================================


function addBot() {


    const name =

    document
    .getElementById(
        "botName"
    )
    .value
    .trim();


    const price =

    Number(

        document
        .getElementById(
            "botPrice"
        )
        .value

    );


    const stock =

    Number(

        document
        .getElementById(
            "botStock"
        )
        .value

    );


    if (

        !name ||

        !price ||

        stock < 0

    ) {


        alert(
            "Please enter valid information."
        );


        return;

    }



    bots.push({

        id:
        Date.now(),

        name:
        name,

        price:
        price,

        stock:
        stock,

        hidden:
        false

    });



    saveBots();


    renderBots();


    document
    .getElementById(
        "botName"
    )
    .value = "";


    document
    .getElementById(
        "botPrice"
    )
    .value = "";


    document
    .getElementById(
        "botStock"
    )
    .value = "";

}



// ======================================
// RESTOCK
// ======================================


function restockBot(
    id
) {


    const amount =

    Number(

        prompt(
            "How many items do you want to add?"
        )

    );


    if (

        !amount ||

        amount <= 0

    ) {

        return;

    }


    const bot =

    bots.find(

        item =>
        item.id === id

    );


    if (bot) {

        bot.stock += amount;

    }


    saveBots();


    renderBots();

}



// ======================================
// HIDE / SHOW
// ======================================


function toggleBot(
    id
) {


    const bot =

    bots.find(

        item =>
        item.id === id

    );


    if (bot) {

        bot.hidden =
        !bot.hidden;

    }


    saveBots();


    renderBots();

}



// ======================================
// DELETE
// ======================================


function deleteBot(
    id
) {


    const confirmDelete =

    confirm(

        "Are you sure you want to delete this bot?"

    );


    if (!confirmDelete) {

        return;

    }


    bots =

    bots.filter(

        bot =>
        bot.id !== id

    );


    saveBots();


    renderBots();

}



// ======================================
// RENDER
// ======================================


function renderBots() {


    const list =

    document
    .getElementById(
        "botList"
    );


    list.innerHTML = "";


    if (
        bots.length === 0
    ) {


        list.innerHTML = `

        <div class="empty">

        No bots added yet.

        </div>

        `;


    }



    bots.forEach(

        bot => {


            const div =

            document
            .createElement(
                "div"
            );


            div.className =
            "bot";


            div.innerHTML = `

            <div class="bot-info">

                <h3>
                ${bot.name}
                </h3>

                <p>
                €${bot.price.toFixed(2)}
                · Stock: ${bot.stock}
                · ${bot.hidden ? "Hidden" : "Visible"}
                </p>

            </div>


            <div class="actions">


                <button
                class="restock"
                onclick="restockBot(${bot.id})"
                >

                + Restock

                </button>


                <button
                class="hide"
                onclick="toggleBot(${bot.id})"
                >

                ${bot.hidden ? "Show" : "Hide"}

                </button>


                <button
                class="delete"
                onclick="deleteBot(${bot.id})"
                >

                Delete

                </button>


            </div>

            `;


            list.appendChild(
                div
            );

        }

    );



    updateStats();

}



// ======================================
// STATS
// ======================================


function updateStats() {


    document
    .getElementById(
        "totalBots"
    )
    .textContent =

    bots.length;



    document
    .getElementById(
        "totalStock"
    )
    .textContent =

    bots.reduce(

        (
            total,
            bot
        ) =>

        total +
        bot.stock,

        0

    );



    document
    .getElementById(
        "hiddenBots"
    )
    .textContent =

    bots.filter(

        bot =>
        bot.hidden

    ).length;

}



// ======================================
// START
// ======================================


renderBots();


</script>


</body>

</html>
