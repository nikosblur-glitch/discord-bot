```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Owner Panel</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0d12;
    color: white;
}

.container {
    max-width: 1000px;
    margin: 50px auto;
    padding: 20px;
}

h1 {
    color: #5865f2;
}

.panel {
    background: #11141c;
    padding: 25px;
    border-radius: 15px;
    border: 1px solid #242936;
    margin-bottom: 25px;
}

input, textarea {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    box-sizing: border-box;
    background: #0b0d12;
    color: white;
    border: 1px solid #303542;
    border-radius: 8px;
}

button {
    padding: 12px 18px;
    border: none;
    border-radius: 8px;
    background: #5865f2;
    color: white;
    font-weight: bold;
    cursor: pointer;
    margin: 5px;
}

button:hover {
    background: #4752c4;
}

.bot {
    padding: 20px;
    margin-top: 15px;
    background: #0b0d12;
    border: 1px solid #242936;
    border-radius: 12px;
}

.bot h3 {
    margin-top: 0;
}

.stock {
    color: #55d68a;
}

.hidden {
    color: #ff6868;
}

.delete {
    background: #d64545;
}

.restock {
    background: #2d9d78;
}

</style>

</head>


<body>


<div class="container">


<h1>
Owner Bot Manager
</h1>


<div class="panel">


<h2>
Add New Bot
</h2>


<input
id="botName"
placeholder="Bot Name"
>


<input
id="botId"
placeholder="Bot ID"
>


<input
id="botPrice"
type="number"
step="0.01"
placeholder="Price"
>


<input
id="botStock"
type="number"
placeholder="Stock"
>


<textarea
id="botDescription"
placeholder="Bot Description"
></textarea>


<input
id="botImage"
placeholder="Image URL"
>


<button
onclick="addBot()"
>

➕ Add Bot

</button>


</div>


<div class="panel">


<h2>
Your Bots
</h2>


<div id="botList">
</div>


</div>


</div>


<script>


let bots =

JSON.parse(

localStorage.getItem(
"marketplaceBots"
)

) || [];



function saveBots() {

    localStorage.setItem(

        "marketplaceBots",

        JSON.stringify(
            bots
        )

    );

}



function addBot() {


    const name =

    document
    .getElementById(
        "botName"
    )
    .value
    .trim();


    const id =

    document
    .getElementById(
        "botId"
    )
    .value
    .trim();


    const price =

    Number(

        document
        .getElementById(
            "botPrice"
        )
        .value

    );


    const stock =

    Number(

        document
        .getElementById(
            "botStock"
        )
        .value

    );


    const description =

    document
    .getElementById(
        "botDescription"
    )
    .value
    .trim();


    const image =

    document
    .getElementById(
        "botImage"
    )
    .value
    .trim();



    if (
        !name ||
        !id ||
        price <= 0 ||
        stock < 0
    ) {

        alert(
            "Please fill in all required fields."
        );

        return;

    }



    const bot = {

        id:
        Date.now(),

        botId:
        id,

        name:
        name,

        price:
        price,

        stock:
        stock,

        description:
        description,

        image:
        image,

        hidden:
        false

    };



    bots.push(bot);


    saveBots();


    renderBots();


    clearForm();

}



function clearForm() {


    document
    .getElementById(
        "botName"
    )
    .value = "";


    document
    .getElementById(
        "botId"
    )
    .value = "";


    document
    .getElementById(
        "botPrice"
    )
    .value = "";


    document
    .getElementById(
        "botStock"
    )
    .value = "";


    document
    .getElementById(
        "botDescription"
    )
    .value = "";


    document
    .getElementById(
        "botImage"
    )
    .value = "";

}



function restockBot(
    id
) {


    const amount =

    Number(

        prompt(
            "How many items do you want to add?"
        )

    );


    if (
        amount <= 0
    ) {

        return;

    }


    const bot =

    bots.find(

        item =>
        item.id === id

    );


    if (bot) {

        bot.stock += amount;

    }


    saveBots();


    renderBots();

}



function toggleBot(
    id
) {


    const bot =

    bots.find(

        item =>
        item.id === id

    );


    if (bot) {

        bot.hidden =
        !bot.hidden;

    }


    saveBots();


    renderBots();

}



function deleteBot(
    id
) {


    if (

        !confirm(
            "Delete this bot?"
        )

    ) {

        return;

    }


    bots =

    bots.filter(

        item =>
        item.id !== id

    );


    saveBots();


    renderBots();

}



function renderBots() {


    const list =

    document
    .getElementById(
        "botList"
    );


    list.innerHTML = "";


    if (
        bots.length === 0
    ) {

        list.innerHTML =

        "<p>No bots available.</p>";

        return;

    }



    bots.forEach(

        bot => {


            const div =

            document
            .createElement(
                "div"
            );


            div.className =
            "bot";


            div.innerHTML = `

            <h3>
            ${bot.name}
            </h3>

            <p>
            Bot ID: ${bot.botId}
            </p>

            <p>
            Price: €${bot.price.toFixed(2)}
            </p>

            <p class="stock">
            Stock: ${bot.stock}
            </p>

            <p>
            ${bot.description}
            </p>

            <p class="${
                bot.hidden
                ? "hidden"
                : "stock"
            }">

            ${
                bot.hidden
                ? "Hidden from marketplace"
                : "Visible in marketplace"
            }

            </p>


            <button
            class="restock"
            onclick="restockBot(${bot.id})"
            >

            🔄 Restock

            </button>


            <button
            onclick="toggleBot(${bot.id})"
            >

            ${
                bot.hidden
                ? "Show Bot"
                : "Hide Bot"
            }

            </button>


            <button
            class="delete"
            onclick="deleteBot(${bot.id})"
            >

            🗑️ Delete

            </button>

            `;


            list.appendChild(
                div
            );

        }

    );

}


renderBots();


</script>


</body>

</html>
```
