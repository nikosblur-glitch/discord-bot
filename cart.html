<body>


    <!-- NAVIGATION -->

    <nav>

        <a
            href="index.html"
            class="logo"
        >
            Discord Board Marketplace
        </a>


        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="bots.html">
                    Bots
                </a>
            </li>

            <li>
                <a href="hosting.html">
                    Hosting
                </a>
            </li>

            <li>
                <a href="support.html">
                    Support
                </a>
            </li>

        </ul>


        <a
            href="cart.html"
            class="cart-button"
        >
            🛒 Cart
        </a>

    </nav>


    <!-- CART -->

    <main class="cart-container">

        <h1>
            🛒 Your Cart
        </h1>


        <div id="cartContent">

        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 Discord Board Marketplace.
            All rights reserved.
        </p>

    </footer>


    <!-- CART JAVASCRIPT -->

    <script>

        function loadCart() {

            let cart =
                JSON.parse(
                    localStorage.getItem("cart")
                ) || [];


            let cartContent =
                document.getElementById(
                    "cartContent"
                );


            if (cart.length === 0) {

                cartContent.innerHTML = `

                    <div class="empty-cart">

                        <h2>
                            Your cart is empty
                        </h2>

                        <p>
                            You haven't added any products yet.
                        </p>

                        <a
                            href="bots.html"
                            class="shop-button"
                        >
                            Browse Bots
                        </a>

                    </div>

                `;

                return;

            }


            let total = 0;


            let itemsHTML = `

                <div class="cart-items">

            `;


            cart.forEach(
                function(item, index) {

                    total += Number(item.price);


                    itemsHTML += `

                        <div class="cart-item">

                            <div class="item-info">

                                <h3>
                                    ${item.name}
                                </h3>

                                <p>
                                    €${Number(item.price).toFixed(2)}
                                </p>

                            </div>


                            <button
                                class="remove-button"
                                onclick="removeItem(${index})"
                            >
                                Remove
                            </button>

                        </div>

                    `;

                }
            );


            itemsHTML += `

                </div>


                <div class="cart-summary">

                    <div class="summary-row">

                        <span>
                            Total
                        </span>

                        <span class="total">
                            €${total.toFixed(2)}
                        </span>

                    </div>


                    <button
                        class="checkout-button"
                        onclick="checkout()"
                    >
                        Proceed to Checkout
                    </button>


                    <button
                        class="clear-button"
                        onclick="clearCart()"
                    >
                        Clear Cart
                    </button>

                </div>

            `;


            cartContent.innerHTML =
                itemsHTML;

        }


        function removeItem(index) {

            let cart =
                JSON.parse(
                    localStorage.getItem("cart")
                ) || [];


            cart.splice(index, 1);


            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );


            loadCart();

        }


        function clearCart() {

            localStorage.removeItem(
                "cart"
            );


            loadCart();

        }


        function checkout() {

            alert(
                "Checkout will be connected to a secure payment provider in the next step."
            );

        }


        loadCart();

    </script>


</body>
