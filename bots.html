```html
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Discord Board Marketplace - Bots</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;

    background:
    radial-gradient(
        circle at 10% 10%,
        rgba(88,101,242,0.25),
        transparent 30%
    ),

    radial-gradient(
        circle at 90% 90%,
        rgba(139,92,246,0.20),
        transparent 30%
    ),

    #05060b;

    padding: 30px 20px;
}

.container {
    max-width: 1200px;
    margin: auto;
}

.back {
    display: inline-block;

    padding: 12px 18px;

    color: white;

    text-decoration: none;

    background:
    rgba(255,255,255,0.07);

    border:
    1px solid
    rgba(255,255,255,0.12);

    border-radius: 12px;

    margin-bottom: 40px;
}

header {
    text-align: center;
    margin-bottom: 50px;
}

header h1 {
    font-size: 48px;
    margin-bottom: 12px;
}

header h1 span {
    color: #7280ff;
}

header p {
    color:
    rgba(255,255,255,0.55);
}

.bot-grid {

    display: grid;

    grid-template-columns:
    repeat(
        auto-fit,
        minmax(260px, 1fr)
    );

    gap: 25px;
}

.bot-card {

    overflow: hidden;

    border-radius: 22px;

    background:
    rgba(255,255,255,0.055);

    border:
    1px solid
    rgba(255,255,255,0.12);

    backdrop-filter:
    blur(25px);

    transition:
    transform 0.3s,
    box-shadow 0.3s;

}

.bot-card:hover {

    transform:
    translateY(-8px);

    box-shadow:
    0 25px 60px
    rgba(0,0,0,0.4);

}

.bot-image {

    width: 100%;

    height: 210px;

    object-fit: cover;

    background:
    #11131c;

}

.bot-content {

    padding: 24px;

}

.bot-content h2 {

    margin-bottom: 10px;

}

.description {

    color:
    rgba(255,255,255,0.55);

    line-height: 1.5;

    min-height: 48px;

}

.price {

    font-size: 25px;

    font-weight: bold;

    color:
    #8d98ff;

    margin-top: 20px;

}

.stock {

    margin-top: 8px;

    margin-bottom: 18px;

    color:
    #72ffb5;

}

.out {

    color:
    #ff7070;

}

.actions {

    display: flex;

    gap: 10px;

}

button,
.invite {

    flex: 1;

    padding: 12px;

    border: none;

    border-radius: 10px;

    color: white;

    font-weight: bold;

    cursor: pointer;

    text-align: center;

    text-decoration: none;

}

.cart {

    background:
    linear-gradient(
        135deg,
        #5865f2,
        #8b5cf6
    );

}

.cart:disabled {

    opacity: 0.35;

    cursor: not-allowed;

}

.invite {

    background:
    rgba(255,255,255,0.08);

}

.empty {

    grid-column:
    1 / -1;

    text-align: center;

    padding: 80px 20px;

    color:
    rgba(255,255,255,0.5);

}

</style>

</head>


<body>


<div class="container">


<a
href="index.html"
class="back"
>

← Back Home

</a>


<header>

<h1>

Discord
<span>Board</span>
Bots

</h1>

<p>

Discover premium Discord bots for your server.

</p>

</header>


<div
id="botGrid"
class="bot-grid"
>

</div>


</div>



<script>


/*
====================================================
PUBLIC BOTS PAGE

There is NO Owner Panel link here.
There is NO Owner Panel button here.
====================================================
*/


const STORAGE_KEY =
"DBM_MARKETPLACE_BOTS";


let bots =

JSON.parse(

localStorage.getItem(
STORAGE_KEY
)

) || [];



const botGrid =

document.getElementById(
"botGrid"
);



function escapeHTML(
value
) {

    return String(
        value || ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}



function renderBots() {


    botGrid.innerHTML =
    "";


    if (
        bots.length === 0
    ) {


        botGrid.innerHTML = `

        <div class="empty">

        <h2>
        No Bots Available
        </h2>

        <br>

        <p>
        Check back soon for new Discord bots.
        </p>

        </div>

        `;


        return;

    }



    bots.forEach(

        bot => {


            const card =

            document.createElement(
                "div"
            );


            card.className =
            "bot-card";


            const image =

            bot.image ||

            "https://via.placeholder.com/600x400?text=Discord+Bot";


            const hasStock =

            Number(
                bot.stock
            ) > 0;



            card.innerHTML = `

            <img

            class="bot-image"

            src="${escapeHTML(
                image
            )}"

            alt="Discord Bot"


            >


            <div class="bot-content">


            <h2>

            ${escapeHTML(
                bot.name
            )}

            </h2>


            <p class="description">

            ${escapeHTML(
                bot.description ||
                "Premium Discord Bot"
            )}

            </p>


            <div class="price">

            €${Number(
                bot.price
            ).toFixed(2)}

            </div>


            <div class="${
                hasStock
                ? "stock"
                : "stock out"
            }">

            ${
                hasStock

                ?

                "✓ In Stock: " +
                bot.stock

                :

                "✕ Out of Stock"
            }

            </div>


            <div class="actions">


            <button

            class="cart"

            ${
                hasStock
                ? ""
                : "disabled"
            }

            onclick="addToCart(
                ${bot.id}
            )"

            >

            🛒 Add to Cart

            </button>


            ${
                bot.invite

                ?

                `<a

                class="invite"

                href="${escapeHTML(
                    bot.invite
                )}"

                target="_blank"

                rel="noopener"

                >

                View

                </a>`

                :

                ""

            }


            </div>


            </div>

            `;


            botGrid.appendChild(
                card
            );

        }

    );

}



function addToCart(
    id
) {


    const bot =

    bots.find(

        item =>
        item.id ===
        id

    );


    if (!bot) {

        return;

    }



    let cart =

    JSON.parse(

        localStorage.getItem(
            "DBM_CART"
        )

    ) || [];



    const existing =

    cart.find(

        item =>
        item.id ===
        id

    );



    if (existing) {

        existing.quantity++;

    }

    else {

        cart.push({

            id:
            bot.id,

            name:
            bot.name,

            price:
            bot.price,

            image:
            bot.image,

            quantity:
            1

        });

    }



    localStorage.setItem(

        "DBM_CART",

        JSON.stringify(
            cart
        )

    );


    alert(
        "Added to cart!"
    );

}



renderBots();


</script>


</body>

</html>
```
