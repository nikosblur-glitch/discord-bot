```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Discord Bots</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0d12;
    color: white;
}

h1 {
    text-align: center;
    margin: 50px 0;
}

.bot-grid {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
    display: grid;
    grid-template-columns:
    repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.bot-card {
    background: #11141c;
    border: 1px solid #242936;
    border-radius: 15px;
    padding: 25px;
}

.bot-card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 15px;
}

.price {
    color: #5865f2;
    font-size: 22px;
    font-weight: bold;
}

.stock {
    color: #55d68a;
}

.out {
    color: #ff6868;
}

button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #5865f2;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #4752c4;
}

button:disabled {
    background: #444957;
    cursor: not-allowed;
}

</style>

</head>


<body>


<h1>

Discord Bots Marketplace

</h1>


<div
class="bot-grid"
id="botGrid"
>
</div>


<script>


let bots =

JSON.parse(

localStorage.getItem(
"marketplaceBots"
)

) || [];



let grid =

document
.getElementById(
"botGrid"
);



bots

.filter(

bot =>
!bot.hidden

)

.forEach(

bot => {


const card =

document
.createElement(
"div"
);


card.className =
"bot-card";


const image =

bot.image ||

"https://via.placeholder.com/500x300?text=Discord+Bot";


card.innerHTML = `

<img
src="${image}"
alt="${bot.name}"
>


<h2>
${bot.name}
</h2>


<p>
${bot.description}
</p>


<p>
Bot ID: ${bot.botId}
</p>


<p class="price">

€${bot.price.toFixed(2)}

</p>


<p class="${
    bot.stock > 0
    ? "stock"
    : "out"
}">

${
    bot.stock > 0
    ? "Available: " + bot.stock
    : "Out of Stock"
}

</p>


<button
onclick="addToCart(
'${bot.name.replace(/'/g, "\\'")}',
${bot.price}
)"
${bot.stock <= 0 ? "disabled" : ""}
>

🛒 Add to Cart

</button>

`;


grid.appendChild(
card
);

}

);



function addToCart(
name,
price
) {


let cart =

JSON.parse(

localStorage.getItem(
"cart"
)

) || [];


cart.push({

id:
Date.now(),

name:
name,

price:
price

});


localStorage.setItem(

"cart",

JSON.stringify(
cart

)

);


alert(

name +
" added to cart!"

);


}


</script>


</body>

</html>
```
